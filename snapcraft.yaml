name: omni-prism
version: 1.0.1
summary: Free, cross-platform image viewer and gallery
description: |
  Omni Prism is a fast, distraction-free image viewer with a built-in gallery
  for browsing the pictures on your computer.

  * View JPEG, PNG, GIF, WEBP, BMP, ICO and SVG images
  * Gallery that scans the folders you choose and groups your images
  * Fullscreen viewing with a transparent, minimal interface
  * Open images directly from your file manager

title: Omni Prism
contact: https://github.com/nexina/omni-prism/issues
license: MIT
issues: https://github.com/nexina/omni-prism/issues
source-code: https://github.com/nexina/omni-prism
website: https://github.com/nexina/omni-prism

confinement: strict
base: core22
grade: stable

apps:
  omni-prism:
    command: omni_prism
    common-id: nexina.omni.prism
    desktop: usr/share/applications/nexina.omni.prism.desktop
    extensions: [gnome]
    plugs:
      - home
      - removable-media
      - desktop
      - desktop-legacy
      - wayland
      - x11
      - opengl

parts:
  omni-prism:
    source: .
    plugin: flutter
    flutter-target: lib/main.dart
    build-packages:
      - clang
      - cmake
      - ninja-build
      - pkg-config
      - libgtk-3-dev
    override-build: |
      # Drop any host build/ dir so its CMake cache doesn't break the build
      rm -rf build
      craftctl default
      # Desktop entry, icon and AppStream metadata
      install -Dm644 linux/nexina.omni.prism.desktop \
        $CRAFT_PART_INSTALL/usr/share/applications/nexina.omni.prism.desktop
      install -Dm644 linux/nexina.omni.prism.png \
        $CRAFT_PART_INSTALL/usr/share/icons/hicolor/256x256/apps/nexina.omni.prism.png
      install -Dm644 linux/nexina.omni.prism.metainfo.xml \
        $CRAFT_PART_INSTALL/usr/share/metainfo/nexina.omni.prism.metainfo.xml
      install -Dm644 LICENSE $CRAFT_PART_INSTALL/LICENSE
